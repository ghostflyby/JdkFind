name: publish

# Tag-triggered release: push a vX.Y.Z tag (e.g. v0.1.0) to build, test, pack both
# packages and publish them to nuget.org plus a GitHub release. The version is
# derived from the tag — the single source of truth — not from the csproj.
# Publish uses NuGet Trusted Publishing (OIDC): no long-lived API key in secrets;
# the short-lived key is exchanged by NuGet/login@v1. Register the matching policy
# on nuget.org for BOTH package ids (JdkFind and JdkFind.Cli):
# owner: ghostflyby, repo: ghostflyby/JdkFind, workflow file: publish.yml.
on:
  push:
    tags: [ 'v*.*.*' ]

# A publish must never be cancelled mid-flight (a half-pushed release), and two
# pushes of the same tag cannot happen — but guard anyway: same-ref publishes
# serialize.
concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

# Every run: step uses pwsh (PowerShell Core), preinstalled on all runners, so the
# same script syntax works on Windows, macOS, and Linux — no bash-isms anywhere.
defaults:
  run:
    shell: pwsh

# Least privilege by default; the publish job widens its own permissions
# explicitly (id-token, attestations, contents, pull-requests).
permissions:
  contents: read

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Set version from tag
        run: |
          "VERSION=$( $env:GITHUB_REF_NAME -replace '^v', '' )" | Out-File -Append -FilePath $env:GITHUB_ENV -Encoding utf8

      # A release candidate must pass the full suite (the multi-OS gate lives in
      # ci.yml; this run re-validates the exact tagged commit on one platform).
      - name: Test
        run: dotnet test --solution JdkFind.slnx -c Release

      - name: Pack
        run: |
          dotnet pack JdkFind/JdkFind.csproj -c Release --nologo -o pkg -p:Version=$env:VERSION
          dotnet pack JdkFind.Cli/JdkFind.Cli.csproj -c Release --nologo -o pkg -p:Version=$env:VERSION

      - name: Upload packages
        uses: actions/upload-artifact@v7
        with:
          name: pkg
          path: pkg/*.nupkg
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish to nuget.org + GitHub release
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # id-token: write lets NuGet/login exchange the OIDC token for a short-lived
    # NuGet API key (Trusted Publishing); attestations: write persists the build
    # provenance attestation in the repository's attestation store; contents: write
    # is for gh release create; pull-requests: write lets the housekeeping step
    # create and merge its PR (requires the repo setting "Allow GitHub Actions
    # to create and approve pull requests").
    permissions:
      id-token: write
      attestations: write
      contents: write
      pull-requests: write
    steps:
      # gh release create and the git history checks resolve the repository through
      # git, so this job needs the checkout even though it builds nothing.
      # fetch-depth: 0 so the validation step can fetch main and inspect the tag commit.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Download packages
        uses: actions/download-artifact@v8
        with:
          name: pkg
          path: pkg

      - name: Validate tag is SemVer, on main, with green CI, and not a downgrade
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          $version = $env:GITHUB_REF_NAME -replace '^v', ''
          # The built-in SemVer type is the format validator: an unparseable tag
          # throws here, so no hand-rolled regex needs keeping in sync.
          $candidateV = [semver]::new($version)
          "VERSION=$version" | Out-File -Append -FilePath $env:GITHUB_ENV -Encoding utf8
          # Refuse versions nuget.org already has, before anything else runs: a
          # re-tag of a historical version gets a clear early exit instead of a
          # build that cannot be pushed.
          foreach ($packageId in 'jdkfind', 'jdkfind.cli')
          {
            $index = try
            {
              Invoke-RestMethod -Uri "https://api.nuget.org/v3-flatcontainer/$packageId/index.json" -TimeoutSec 30
            }
            catch
            {
              $null
            }
            if ($index -and ($index.versions -contains $version))
            {
              throw "version '$version' of '$packageId' is already published on nuget.org — refusing to republish (traceability tag only)"
            }
          }
          # The tag commit must sit on main's history: a tag on a side branch or a
          # stray commit never reaches the production publish.
          git merge-base --is-ancestor "$env:GITHUB_SHA" origin/main
          if ($LASTEXITCODE -ne 0)
          {
            throw "tag commit $env:GITHUB_SHA is not an ancestor of origin/main"
          }
          # And its CI must have passed: a release rides on the commit the
          # multi-platform suite ran against.
          $run = try
          {
            gh run list --workflow ci.yml --commit "$env:GITHUB_SHA" --status success --limit 1 --json databaseId --jq '.[0].databaseId' 2> $null
          }
          catch
          {
            $global:LASTEXITCODE = 0
            $null
          }
          if (-not $run)
          {
            throw "no successful ci.yml run found for tag commit $env:GITHUB_SHA — tag before merging, not after"
          }
          Write-Host "ok: tag commit is on main with green CI (run $run)"
          # 'gh release list' exits 1 when no release exists yet (first publish); with
          # $PSNativeCommandUseErrorActionPreference = $true that becomes a terminating
          # error, so wrap it. The catch must also reset $LASTEXITCODE: pwsh exits the
          # script with the last external command's code, so a swallowed '1' would
          # still fail the step.
          $latest = try
          {
            gh release list --limit 1 --json tagName --jq '.[0].tagName' 2> $null
          }
          catch
          {
            $global:LASTEXITCODE = 0
            $null
          }
          if ($latest)
          {
            $latestV = $latest -replace '^v', ''
            # The value parsed above doubles as the comparison operand; prerelease
            # identifiers follow SemVer 2.0 precedence rules.
            $previousV = [semver]::new($latestV)
            if ($candidateV -le $previousV)
            {
              throw "version '$version' is not newer than the latest release '$latestV'"
            }
            Write-Host "ok: $version > $latestV"
          }
          else
          {
            Write-Host 'no previous release; this is the first publish'
          }
          # Normal path ends cleanly even if an external command left $LASTEXITCODE set;
          # throw paths above terminate with a non-zero exit before reaching here.
          exit 0
        env:
          GH_TOKEN: ${{ github.token }}

      # Signed provenance for the exact artifacts about to be pushed: a consumer
      # (or nuget.org's UI) can verify these bytes were built by this repository's
      # workflow from this commit. Runs before the push so only artifacts that
      # passed every gate above get attested.
      - name: Attest build provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            pkg/JdkFind.${{ env.VERSION }}.nupkg
            pkg/JdkFind.Cli.${{ env.VERSION }}.nupkg

      - name: NuGet login (OIDC → temporary API key)
        uses: NuGet/login@v1
        id: login
        with:
          # nuget.org username (profile name), not an email address. The temp key is
          # valid for 1 hour and is exchanged right before the push.
          user: ${{ secrets.NUGET_USER }}

      # No --skip-duplicate: a version that already exists must fail loudly, not be
      # silently dropped — two different artifacts for the "same" version are
      # exactly the accident this must never paper over. The already-published
      # guard in the validation step catches the re-tag case before anything runs.
      - name: Publish to nuget.org
        run: |
          dotnet nuget push "pkg/JdkFind.$env:VERSION.nupkg" --source https://api.nuget.org/v3/index.json --api-key ""
          dotnet nuget push "pkg/JdkFind.Cli.$env:VERSION.nupkg" --source https://api.nuget.org/v3/index.json --api-key ""

      - name: Create GitHub release
        run: |
          gh release create "$env:GITHUB_REF_NAME" --title "$env:GITHUB_REF_NAME" `
            --notes "JDK locator library and jdkfind tool — see https://www.nuget.org/packages/JdkFind.Cli/$env:VERSION for package details." `
            "pkg/JdkFind.$env:VERSION.nupkg" "pkg/JdkFind.Cli.$env:VERSION.nupkg"
        env:
          GH_TOKEN: ${{ github.token }}

      # Publish-time housekeeping: the API shipped in this release must move from
      # Unshipped to Shipped, so Shipped stays an accurate record of what is actually
      # published on nuget.org. The exact set is the Unshipped entries present on the
      # tag commit (this checkout), merged into main's Shipped and removed from main's
      # Unshipped — later additions on main stay unshipped. A failure here only marks
      # the run red after the release itself is already done.
      - name: Move published API into Shipped (housekeeping PR)
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          # The working tree is the tag commit: its Unshipped entries are what shipped.
          $tagUnshipped = @(Get-Content 'JdkFind/PublicAPI.Unshipped.txt' | Where-Object { $_ -and -not $_.StartsWith('#') })
          if ($tagUnshipped.Count -eq 0)
          {
            Write-Host 'no unshipped API on this tag; nothing to move'
            exit 0
          }
          git fetch origin main
          git checkout -b "housekeeping/shipped-v$env:VERSION" FETCH_HEAD
          $shippedPath = 'JdkFind/PublicAPI.Shipped.txt'
          $unshippedPath = 'JdkFind/PublicAPI.Unshipped.txt'
          $shipped = @(Get-Content $shippedPath | Where-Object { $_ -and -not $_.StartsWith('#') })
          $unshipped = @(Get-Content $unshippedPath | Where-Object { $_ -and -not $_.StartsWith('#') })
          $removedPrefix = '*REMOVED*'
          $tagAdditions = @($tagUnshipped | Where-Object { -not $_.StartsWith($removedPrefix) })
          $tagRemovals = @($tagUnshipped | Where-Object { $_.StartsWith($removedPrefix) } | ForEach-Object { $_.Substring($removedPrefix.Length) })
          $remainingShipped = @($shipped | Where-Object { $_ -notin $tagRemovals })
          $newShipped = @(($remainingShipped + $tagAdditions) | Select-Object -Unique)
          $newUnshipped = @($unshipped | Where-Object { $_ -notin $tagUnshipped })
          # Sort by the stripped symbol key, matching the existing Shipped ordering.
          $key = { param($s) ($s -replace '^\*REMOVED\*', '') -replace '^(static |override )', '' }
          $newShipped = @($newShipped | Sort-Object -Property @{ Expression = $key })
          $newUnshipped = @($newUnshipped | Sort-Object -Property @{ Expression = $key })
          "#nullable enable`n$( $newShipped -join "`n" )`n" | Set-Content -Path $shippedPath -NoNewline
          "#nullable enable`n$( $newUnshipped -join "`n" )`n" | Set-Content -Path $unshippedPath -NoNewline
          git add $shippedPath $unshippedPath
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' `
            commit -m "chore: move shipped API to Shipped for $env:GITHUB_REF_NAME"
          git push -u origin "housekeeping/shipped-v$env:VERSION"
          gh pr create --base main --head "housekeeping/shipped-v$env:VERSION" `
            --title "chore: move shipped API to Shipped for $env:GITHUB_REF_NAME" `
            --body "Publish-time housekeeping: the API shipped in $env:GITHUB_REF_NAME moves from Unshipped to Shipped (the entries present on the tag commit)."
          # Direct merge, not --auto: the branch is pushed with the repository's own
          # GITHUB_TOKEN, whose events start no workflow runs, so the PR never gains
          # checks and GitHub rejects auto-merge with "Pull request is in clean status".
          gh pr merge --merge
        env:
          GH_TOKEN: ${{ github.token }}
